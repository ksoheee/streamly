spring:
  application:
    name: streamly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamly}
    username: ${DB_USERNAME:streamly}
    password: ${DB_PASSWORD:streamly}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
