spring:
  application:
    name: streamly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamly}
    username: ${DB_USERNAME:streamly}
    password: ${DB_PASSWORD:streamly}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # 운영(HTTPS)에서는 COOKIE_SECURE=true
        secure: ${COOKIE_SECURE:false}

streamly:
  demo-password: ${DEMO_PASSWORD:}
  publish-token-ttl: 10m
  reconnect-grace: 30s
  mediamtx-api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
  # MediaMTX 녹화 폴더. 운영은 compose 볼륨(/recordings), 로컬은 infra/recordings
  recordings-dir: ${RECORDINGS_DIR:../infra/recordings}
  recording-retention: 7d
  # 토스페이먼츠 테스트 키 (test_ck_..., test_sk_...). 비우면 도네이션 결제를 시작할 수 없다.
  toss-client-key: ${TOSS_CLIENT_KEY:}
  toss-secret-key: ${TOSS_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
