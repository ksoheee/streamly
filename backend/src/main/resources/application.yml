spring:
  application:
    name: streamly
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streamly}
    username: ${DB_USERNAME:streamly}
    password: ${DB_PASSWORD:streamly}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
