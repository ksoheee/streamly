# 로컬 개발용 인프라. (운영 배포용은 STR-17에서 따로 만든다)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamly
      POSTGRES_USER: streamly
      POSTGRES_PASSWORD: streamly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mediamtx:
    # 브라우저 송출(WHIP) http://localhost:8889/<경로>/whip, 시청(WHEP) http://localhost:8889/<경로>/whep
    image: bluenviron/mediamtx:latest
    ports:
      - "8889:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"

volumes:
  pgdata:
