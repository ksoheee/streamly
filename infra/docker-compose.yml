# 로컬 개발용 인프라. (운영 배포용은 STR-17에서 따로 만든다)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamly
      POSTGRES_USER: streamly
      POSTGRES_PASSWORD: streamly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  mediamtx:
    # 브라우저 송출(WHIP) http://localhost:8889/<경로>/whip, 시청(WHEP) http://localhost:8889/<경로>/whep
    # 운영과 같은 설정(송출 인증·상태 훅). 훅이 wget 을 쓰므로 ffmpeg 이미지(wget 포함)를 쓴다
    image: bluenviron/mediamtx:latest-ffmpeg
    volumes: ["./mediamtx.yml:/mediamtx.yml:ro", "./recordings:/recordings"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "8889:8889"
      - "9997:9997"
      - "8189:8189/udp"
      - "8189:8189/tcp"

volumes:
  pgdata:
