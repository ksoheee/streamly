# 루프 1의 "수정"과 "멈춤 조건".
# CI가 PR에서 실패하면 Claude가 같은 브랜치에 수정 커밋을 올린다.
# 시도 횟수는 PR 라벨(autofix-1..3)로 센다. 3회를 넘기거나 Claude가 아무것도 고치지 못하면
# needs-human 라벨과 이슈를 만들고 멈춘다.
name: Autofix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: autofix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  RUN_ID: ${{ github.event.workflow_run.id }}
  RUN_URL: ${{ github.event.workflow_run.html_url }}
  HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  MAX_ATTEMPTS: "3"

jobs:
  autofix:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 상황 판단 (수정 / 사람에게 넘김 / 건너뜀)
        id: decide
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then echo "action=skip" >> "$GITHUB_OUTPUT"; echo "열린 PR 없음"; exit 0; fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          CURRENT=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$CURRENT" != "$HEAD_SHA" ]; then
            echo "action=skip" >> "$GITHUB_OUTPUT"; echo "더 새로운 커밋이 있어 건너뜀"; exit 0
          fi

          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx 'needs-human'; then
            echo "action=skip" >> "$GITHUB_OUTPUT"; echo "이미 사람에게 넘어간 PR"; exit 0
          fi

          N=$(echo "$LABELS" | grep -c '^autofix-[0-9]' || true)
          if [ "$N" -ge "$MAX_ATTEMPTS" ]; then
            echo "action=escalate" >> "$GITHUB_OUTPUT"
            echo "reason=자동 수정 ${MAX_ATTEMPTS}회 시도 후에도 CI 실패" >> "$GITHUB_OUTPUT"
          else
            echo "action=fix" >> "$GITHUB_OUTPUT"
            echo "attempt=$((N + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: 라벨 준비
        if: steps.decide.outputs.action != 'skip'
        run: |
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            gh label create "autofix-$i" --repo "$REPO" --color FBCA04 --description "자동 수정 시도 $i회차" --force
          done
          gh label create needs-human --repo "$REPO" --color D93F0B --description "에이전트가 못 고침. 사람 판단 필요" --force
          gh label create autofix-succeeded --repo "$REPO" --color 0E8A16 --description "자동 수정으로 CI 통과" --force

      # ---------- 수정 ----------
      - name: 시도 횟수 기록
        if: steps.decide.outputs.action == 'fix'
        run: gh pr edit "${{ steps.decide.outputs.pr }}" --repo "$REPO" --add-label "autofix-${{ steps.decide.outputs.attempt }}"

      - uses: actions/checkout@v4
        if: steps.decide.outputs.action == 'fix'
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: 실패 로그 수집
        if: steps.decide.outputs.action == 'fix'
        run: |
          mkdir -p .autofix
          gh run view "$RUN_ID" --repo "$REPO" --log-failed | tail -n 400 > .autofix/ci-failed.log || true
          echo "수집된 로그 줄 수: $(wc -l < .autofix/ci-failed.log)"

      - uses: actions/setup-java@v4
        if: steps.decide.outputs.action == 'fix'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.decide.outputs.action == 'fix'

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.action == 'fix'
        with:
          node-version: "22"

      - name: Claude 자동 수정
        if: steps.decide.outputs.action == 'fix'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2회차부터는 CI를 트리거한 주체가 claude[bot] 이므로 봇 실행을 허용해야 한다.
          # 무한 루프는 위의 라벨 카운트(최대 3회)가 막는다.
          allowed_bots: "claude[bot]"
          prompt: |
            이 저장소의 CI가 PR 브랜치 `${{ github.event.workflow_run.head_branch }}` 에서 실패했다.
            자동 수정 시도 ${{ steps.decide.outputs.attempt }}/${{ env.MAX_ATTEMPTS }} 회차다.

            1. 먼저 CLAUDE.md 를 읽고 규칙을 따른다.
            2. `.autofix/ci-failed.log` 에서 실패 원인을 찾는다.
            3. 원인을 고친다. 백엔드는 `cd backend && ./gradlew spotlessApply test` 로 직접 확인한다.
            4. 고쳤으면 커밋 메시지를 `fix(autofix): <원인 한 줄>` 형식으로 커밋하고 현재 브랜치에 push 한다.

            절대 규칙:
            - `backend/src/test/java/**/acceptance/`, `.github/`, `CLAUDE.md` 는 수정하지 않는다. 이것이 정답 기준이다.
            - 테스트를 삭제하거나, @Disabled 를 붙이거나, 단언을 약하게 바꾸거나, 빌드에서 제외하지 않는다.
            - `.autofix/` 폴더는 커밋하지 않는다.
            - 원인이 요구사항·설계 문제라서 코드로 고칠 수 없다고 판단되면 아무것도 커밋하지 말고 이유만 출력한다.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cd:*),Bash(./gradlew:*),Bash(npm:*),Bash(npx:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*)"

      - name: 수정 결과 확인
        if: steps.decide.outputs.action == 'fix'
        id: result
        run: |
          REMOTE=$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)
          if [ "$REMOTE" = "$HEAD_SHA" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Claude가 수정 커밋을 올리지 않음 → 사람에게 넘김"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            gh pr comment "${{ steps.decide.outputs.pr }}" --repo "$REPO" \
              --body "🤖 자동 수정 ${{ steps.decide.outputs.attempt }}/${MAX_ATTEMPTS}회차 커밋을 올렸습니다. CI가 다시 실행됩니다. (실패했던 실행: $RUN_URL)"
          fi

      # ---------- 사람에게 넘김 ----------
      - name: 사람에게 넘김 (needs-human)
        if: >-
          steps.decide.outputs.action == 'escalate' ||
          (steps.decide.outputs.action == 'fix' && steps.result.outputs.pushed == 'false')
        run: |
          PR="${{ steps.decide.outputs.pr }}"
          REASON="${{ steps.decide.outputs.reason }}"
          [ -z "$REASON" ] && REASON="Claude가 코드로 고칠 수 없다고 판단해 커밋하지 않음"
          gh pr edit "$PR" --repo "$REPO" --add-label needs-human
          LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed | tail -n 60 || true)
          BODY=$(printf '## 사람 판단이 필요합니다\n\n- PR: #%s\n- 사유: %s\n- 실패한 CI: %s\n\n### 실패 로그 (마지막 60줄)\n```\n%s\n```\n\n### 확인할 것\n- 요구사항이나 인수 테스트 자체가 잘못되지 않았는지\n- 설계 변경이 필요한지\n' "$PR" "$REASON" "$RUN_URL" "$LOG")
          gh issue create --repo "$REPO" --title "[needs-human] PR #$PR: $REASON" --body "$BODY" --label needs-human
          gh pr comment "$PR" --repo "$REPO" --body "🙋 자동 수정을 멈추고 사람에게 넘겼습니다. 사유: $REASON"

  record-success:
    # 자동 수정 후 CI가 통과하면 성공 라벨을 붙인다. 포트폴리오용 성공률 데이터가 된다.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 자동 수정 성공 기록
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -z "$PR" ] && exit 0
          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q '^autofix-[0-9]' && ! echo "$LABELS" | grep -qx 'needs-human'; then
            gh label create autofix-succeeded --repo "$REPO" --color 0E8A16 --description "자동 수정으로 CI 통과" --force
            gh pr edit "$PR" --repo "$REPO" --add-label autofix-succeeded
          fi
